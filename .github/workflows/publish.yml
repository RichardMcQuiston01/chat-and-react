name: Publish

# Publishes the three packages to npm when a GitHub release is published, or when run
# by hand from the Actions tab. The release tag (for example v0.6.0) must match the
# version in each package.json. Needs the NPM_TOKEN repository secret.
#
# Packages are packed with `bun pm pack`, which replaces `workspace:*` dependencies
# with real versions, and the tarballs are published with `npm publish` so they get
# provenance. Publishing with `npm publish` from a package directory would leave
# `workspace:*` in the published package.json, which npm cannot install.
#
# A version with a prerelease part (1.0.0-rc.1) is published under the `next` npm tag, so it
# never becomes `latest`. Any other version is published under `latest`. Mark the GitHub
# release as a pre-release for a prerelease version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Check and pack everything, but do not publish
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - run: bun run lint

      # web and the type checks read core's built output, so build core first
      - run: bun run build
        working-directory: packages/core
      - run: bun run build
        working-directory: packages/web

      - run: bun run typecheck
      - run: bun run test

      # Build every package, so each dist is current before packing
      - run: bun run build

      - name: Check versions
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          for dir in core adapters web; do
            PACKAGE_VERSION="$(node -p "require('./packages/$dir/package.json').version")"
            if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
              echo "packages/$dir is at $PACKAGE_VERSION but packages/core is at $VERSION; all three must match" >&2
              exit 1
            fi
          done
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v$VERSION" >&2
            exit 1
          fi
          case "$VERSION" in
            *-*) NPM_TAG=next ;;
            *) NPM_TAG=latest ;;
          esac
          echo "Publishing $VERSION under the npm tag \"$NPM_TAG\""
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"

      # Core first: adapters and web depend on it.
      - name: Pack and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          for dir in core adapters web; do
            NAME="$(node -p "require('./packages/$dir/package.json').name")"
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION is already on npm; skipping"
              continue
            fi
            (cd "packages/$dir" && bun pm pack --destination "$RUNNER_TEMP/pack")
            SLUG="${NAME#@}"
            TARBALL="$RUNNER_TEMP/pack/${SLUG//\//-}-$VERSION.tgz"
            if tar -xOzf "$TARBALL" package/package.json | grep -q 'workspace:'; then
              echo "$TARBALL still has a workspace: dependency; refusing to publish it" >&2
              exit 1
            fi
            if [ "$DRY_RUN" = "true" ]; then
              npm publish "$TARBALL" --access public --tag "$NPM_TAG" --dry-run
            else
              npm publish "$TARBALL" --access public --tag "$NPM_TAG" --provenance
            fi
          done

  # Replaces GitHub's auto-generated release notes (the list of every merged pull request) with
  # this version's CHANGELOG section. Notes written by hand are left alone.
  release-notes:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Use the CHANGELOG as the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          BODY="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          FIRST_LINE="${BODY%%$'\n'*}"
          FIRST_LINE="${FIRST_LINE%$'\r'}"
          if [ -z "$BODY" ] || [ "$FIRST_LINE" = "## What's Changed" ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
            echo "Replaced the auto-generated release notes with the CHANGELOG section for $VERSION"
          else
            echo "The release notes were written by hand; leaving them as they are"
          fi
