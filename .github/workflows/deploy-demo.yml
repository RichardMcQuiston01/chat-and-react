name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "packages/web/**"
      - "packages/demo/**"
      - "bun.lock"
      - "biome.json"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - run: bun install --frozen-lockfile

      # Fail the deploy on lint or formatting errors (warnings are allowed)
      - run: bun run lint

      # Build in dependency order: core → web → demo
      - run: bun run build
        working-directory: packages/core
      - run: bun run build
        working-directory: packages/web
      - run: bun run build
        working-directory: packages/demo

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
