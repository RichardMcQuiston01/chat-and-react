name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - name: Test the release scripts
        run: node --test "scripts/*.test.mjs"

      # web and the type checks read core's built output, so build core first
      - run: bun run build
        working-directory: packages/core
      - run: bun run build
        working-directory: packages/web

      - run: bun run typecheck
      - run: bun run test

      # Build every package, to catch build-only failures
      - run: bun run build
